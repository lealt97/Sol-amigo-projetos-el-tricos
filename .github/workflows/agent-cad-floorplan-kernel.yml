name: Agent CAD floorplan kernel

on:
  push:
    branches:
      - agent/cad-floorplan-kernel

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[agent-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/cad-floorplan-kernel
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply FloorPlanEditor integration
        run: python scripts/refactor-floorplan-cad.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: CAD geometry regressions
        run: npm run test:cad

      - name: Production build
        run: npm run build

      - name: Commit validated editor integration
        run: |
          git config user.name "Renan Leal"
          git config user.email "lealt97@gmail.com"
          git add src/components/FloorPlanEditor.tsx
          git commit -m "refactor: integrar núcleo geométrico do CAD [agent-done]"
          git push origin agent/cad-floorplan-kernel
