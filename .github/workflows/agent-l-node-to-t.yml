name: Agent L node to T

on:
  push:
    branches:
      - agent/l-node-to-t

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[agent-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/l-node-to-t
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply L-to-T topology patch
        run: python scripts/enable_l_node_to_t.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated change
        run: |
          git config user.name "Renan Leal"
          git config user.email "lealt97@gmail.com"
          git add src/components/FloorPlanEditor.tsx
          git commit -m "feat: permitir puxar parede de L para criar T [agent-done]"
          git push origin agent/l-node-to-t
