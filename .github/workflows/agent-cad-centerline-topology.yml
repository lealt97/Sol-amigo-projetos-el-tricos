name: Agent CAD centerline topology

on:
  push:
    branches:
      - agent/cad-centerline-topology

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[agent-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/cad-centerline-topology
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix temporary patch typing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/migrate-centerline-topology.py')
          text = p.read_text()
          text = text.replace(
            "const migratedWallById = new Map(migratedWalls.map((wall) => [wall.id, wall] as const));",
            "const migratedWallById = new Map<string, FloorPlanWall>(migratedWalls.map((wall) => [wall.id, wall] as const));"
          )
          text = text.replace(
            "const previousWallById = new Map(floorPlanWalls.map((wall) => [wall.id, wall] as const));",
            "const previousWallById = new Map<string, FloorPlanWall>(floorPlanWalls.map((wall) => [wall.id, wall] as const));"
          )
          p.write_text(text)
          PY

      - name: Apply canonical centerline topology
        run: python scripts/migrate-centerline-topology.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: CAD geometry regressions
        run: npm run test:cad

      - name: Production build
        run: npm run build

      - name: Commit validated implementation
        run: |
          git config user.name "Renan Leal"
          git config user.email "lealt97@gmail.com"
          git add src/utils/wallCadEngine.ts scripts/wall-cad-regression.ts src/components/FloorPlanEditor.tsx
          git commit -m "refactor: canonizar paredes customizadas por eixos [agent-done]"
          git push origin agent/cad-centerline-topology
