name: Agent draggable CAD elements

on:
  push:
    branches:
      - agent/cad-drag-elements

permissions:
  contents: write

concurrency:
  group: agent-cad-drag-elements
  cancel-in-progress: true

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/cad-drag-elements
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply draggable element refactor
        run: python3 scripts/refactor-drag-elements.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        run: |
          rm -f scripts/refactor-drag-elements.py .github/workflows/agent-drag-elements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/components/FloorPlanEditor.tsx scripts/refactor-drag-elements.py .github/workflows/agent-drag-elements.yml || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: allow dragging CAD elements"
          git push origin HEAD:agent/cad-drag-elements
