name: Agent strict L vs T junction

on:
  push:
    branches:
      - agent/strict-l-vs-t-junction

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[agent-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/strict-l-vs-t-junction
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply strict L vs T patch
        run: python scripts/strict_l_vs_t_junction.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated change
        run: |
          git config user.name "Renan Leal"
          git config user.email "lealt97@gmail.com"
          git add src/components/FloorPlanEditor.tsx
          git commit -m "fix: usar L somente no nó exato da parede [agent-done]"
          git push origin agent/strict-l-vs-t-junction
