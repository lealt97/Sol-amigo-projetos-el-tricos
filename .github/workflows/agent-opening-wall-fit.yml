name: Agent opening wall fit

on:
  push:
    branches:
      - agent/perfect-opening-wall-fit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/perfect-opening-wall-fit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply opening wall-fit refactor
        run: python3 scripts/apply_opening_wall_fit.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanEditor.tsx src/types.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: anchor doors and windows exactly to walls"
            git push origin HEAD:agent/perfect-opening-wall-fit
          fi
