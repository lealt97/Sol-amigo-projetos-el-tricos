name: Agent architectural wall junctions

on:
  push:
    branches:
      - agent/architectural-wall-junctions

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/architectural-wall-junctions
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tighten architectural seam cut
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/FloorPlanEditor.tsx')
          text = p.read_text()

          old = 'const halfGap = thickPx / (2 * Math.max(0.25, normalComponent)) + 2.5;'
          new = 'const halfGap = thickPx / (2 * Math.max(0.25, normalComponent));'
          if old not in text:
              raise SystemExit('halfGap anchor not found')
          text = text.replace(old, new, 1)

          group_old = 'strokeLinecap="square" pointerEvents="none">'
          group_new = 'strokeLinecap="butt" pointerEvents="none">'
          group_anchor = 'room-junction-cut-${w.id}-${endpointKey}'
          group_pos = text.find(group_anchor)
          if group_pos < 0:
              raise SystemExit('junction group anchor not found')
          suffix_pos = text.find(group_old, group_pos)
          if suffix_pos < 0:
              raise SystemExit('junction strokeLinecap anchor not found')
          text = text[:suffix_pos] + text[suffix_pos:].replace(group_old, group_new, 1)

          width_pos = text.find('strokeWidth="6"', group_pos)
          if width_pos < 0:
              raise SystemExit('junction eraser width anchor not found')
          text = text[:width_pos] + text[width_pos:].replace('strokeWidth="6"', 'strokeWidth="4"', 1)

          pattern_marker = 'stroke="url(#wallMasonryPattern)"'
          marker_pos = text.find(pattern_marker, group_pos)
          if marker_pos < 0:
              raise SystemExit('junction pattern line anchor not found')
          line_start = text.rfind('<line', group_pos, marker_pos)
          line_end = text.find('/>', marker_pos)
          if line_start < 0 or line_end < 0:
              raise SystemExit('junction pattern line bounds not found')
          line_end += 2
          while line_start > 0 and text[line_start - 1] in ' \t':
              line_start -= 1
          if line_start > 0 and text[line_start - 1] == '\n':
              line_start -= 1
          text = text[:line_start] + text[line_end:]

          p.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanEditor.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: alinhar recorte da junção à largura exata da parede"
            git push origin HEAD:agent/architectural-wall-junctions
          fi
