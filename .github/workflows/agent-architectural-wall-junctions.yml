name: Agent architectural wall junctions

on:
  push:
    branches:
      - agent/architectural-wall-junctions

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/architectural-wall-junctions
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tighten architectural seam cut
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/FloorPlanEditor.tsx')
          text = p.read_text()
          old = '''                    const halfGap = thickPx / (2 * Math.max(0.25, normalComponent)) + 2.5;'''
          new = '''                    const halfGap = thickPx / (2 * Math.max(0.25, normalComponent));'''
          if old not in text:
              raise SystemExit('halfGap anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('''<g key={`room-junction-cut-${w.id}-${endpointKey}`} strokeLinecap="square" pointerEvents="none">''', '''<g key={`room-junction-cut-${w.id}-${endpointKey}`} strokeLinecap="butt" pointerEvents="none">''', 1)
          old_lines = '''                        <line
                          x1={cx - tx * halfGap}
                          y1={cy - ty * halfGap}
                          x2={cx + tx * halfGap}
                          y2={cy + ty * halfGap}
                          stroke="#CBD5E1"
                          strokeWidth="6"
                        />
                        <line
                          x1={cx - tx * halfGap}
                          y1={cy - ty * halfGap}
                          x2={cx + tx * halfGap}
                          y2={cy + ty * halfGap}
                          stroke="url(#wallMasonryPattern)"
                          strokeWidth="4"
                          opacity="0.65"
                        />'''
          new_lines = '''                        <line
                          x1={cx - tx * halfGap}
                          y1={cy - ty * halfGap}
                          x2={cx + tx * halfGap}
                          y2={cy + ty * halfGap}
                          stroke="#CBD5E1"
                          strokeWidth="4"
                        />'''
          if old_lines not in text:
              raise SystemExit('seam line block not found')
          text = text.replace(old_lines, new_lines, 1)
          p.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanEditor.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: alinhar recorte da junção à largura exata da parede"
            git push origin HEAD:agent/architectural-wall-junctions
          fi
