name: Agent unified wall groups

on:
  push:
    branches:
      - agent/unified-wall-groups

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[agent-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/unified-wall-groups
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply wall-group patch
        run: python scripts/unify_wall_groups.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated change
        run: |
          git config user.name "Renan Leal"
          git config user.email "lealt97@gmail.com"
          git add src/types.ts src/components/FloorPlanEditor.tsx
          git commit -m "feat: tratar paredes conectadas como uma planta unica [agent-done]"
          git push origin agent/unified-wall-groups
