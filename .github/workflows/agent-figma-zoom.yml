name: Agent Figma-style CAD zoom

on:
  push:
    branches:
      - agent/figma-zoom-shortcuts

permissions:
  contents: write

concurrency:
  group: agent-figma-zoom-shortcuts
  cancel-in-progress: true

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/figma-zoom-shortcuts
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Apply Figma-style zoom refactor
        run: python3 scripts/refactor-figma-zoom.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        run: |
          rm -f scripts/refactor-figma-zoom.py .github/workflows/agent-figma-zoom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanEditor.tsx scripts/refactor-figma-zoom.py .github/workflows/agent-figma-zoom.yml || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add Figma-style CAD zoom shortcuts"
          git push origin HEAD:agent/figma-zoom-shortcuts
