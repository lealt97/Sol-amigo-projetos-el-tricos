name: Agent fit sheet viewport

on:
  push:
    branches:
      - agent/fit-sheet-viewport

permissions:
  contents: write

concurrency:
  group: agent-fit-sheet-viewport
  cancel-in-progress: true

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fit-sheet-viewport
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply sheet viewport refactor
        run: python3 scripts/refactor-fit-sheet-viewport.py

      - name: Normalize generated SVG attribute
        run: |
          sed -i 's/            height="100%$/            height="100%"/' src/components/FloorPlanEditor.tsx

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        run: |
          rm -f scripts/refactor-fit-sheet-viewport.py .github/workflows/agent-fit-sheet-viewport.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanEditor.tsx scripts/refactor-fit-sheet-viewport.py .github/workflows/agent-fit-sheet-viewport.yml || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: fit entire sheet in CAD viewport"
          git push origin HEAD:agent/fit-sheet-viewport
