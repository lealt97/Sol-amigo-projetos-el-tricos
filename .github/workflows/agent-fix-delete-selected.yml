name: Agent fix delete selected

on:
  push:
    branches:
      - agent/fix-delete-selected

permissions:
  contents: write

concurrency:
  group: agent-fix-delete-selected
  cancel-in-progress: true

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-delete-selected
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply delete-selection fix
        run: python3 scripts/fix-delete-selected.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        run: |
          rm -f scripts/fix-delete-selected.py .github/workflows/agent-fix-delete-selected.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanEditor.tsx scripts/fix-delete-selected.py .github/workflows/agent-fix-delete-selected.yml || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: delete selected CAD elements atomically"
          git push origin HEAD:agent/fix-delete-selected
