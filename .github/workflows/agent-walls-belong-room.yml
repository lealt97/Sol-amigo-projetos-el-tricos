name: Agent walls belong to room

on:
  push:
    branches:
      - agent/walls-belong-to-room

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/walls-belong-to-room
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: python scripts/attach_walls_to_room.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanEditor.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: vincular paredes desenhadas ao cômodo"
            git push origin HEAD:agent/walls-belong-to-room
          fi
