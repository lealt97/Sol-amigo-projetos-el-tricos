name: Agent room wall axis snap

on:
  push:
    branches:
      - agent/room-wall-axis-snap

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/room-wall-axis-snap
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply room wall axis snap
        run: python3 scripts/apply_room_wall_axis_snap.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanEditor.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: align custom walls to room wall axes"
            git push origin agent/room-wall-axis-snap
          fi
