name: Agent scale refactor

on:
  push:
    branches:
      - agent/scale-denominator-refactor

permissions:
  contents: write

jobs:
  refactor-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/scale-denominator-refactor

      - name: Setup Node.js
        uses: actions/setup-node@7
        with:
          node-version: 24

      - name: Apply scale refactor
        run: python scripts/apply-scale-refactor.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          rm scripts/apply-scale-refactor.py
          rm .github/workflows/agent-scale-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanEditor.tsx src/components/SheetOverlaySVG.tsx src/components/SheetExportModal.tsx scripts/apply-scale-refactor.py .github/workflows/agent-scale-refactor.yml
          git commit -m "refactor: separate technical scale from viewport"
          git push origin HEAD:agent/scale-denominator-refactor
