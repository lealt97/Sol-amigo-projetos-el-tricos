name: Agent CAD planar room faces

on:
  push:
    branches:
      - agent/cad-planar-room-faces

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[agent-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/cad-planar-room-faces
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply planar room-face solver
        run: python scripts/add-planar-wall-faces.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: CAD geometry regressions
        run: npm run test:cad

      - name: Production build
        run: npm run build

      - name: Commit validated implementation
        run: |
          git config user.name "Renan Leal"
          git config user.email "lealt97@gmail.com"
          git add src/utils/wallCadEngine.ts scripts/wall-cad-regression.ts src/components/FloorPlanEditor.tsx
          git commit -m "feat: reconhecer faces fechadas da planta [agent-done]"
          git push origin agent/cad-planar-room-faces
