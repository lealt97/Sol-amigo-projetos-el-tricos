name: Agent wall contrast

on:
  push:
    branches:
      - agent/wall-contrast

permissions:
  contents: write

concurrency:
  group: agent-wall-contrast
  cancel-in-progress: true

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/wall-contrast
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply wall contrast refactor
        run: python3 scripts/refactor-wall-contrast.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        run: |
          rm -f scripts/refactor-wall-contrast.py .github/workflows/agent-wall-contrast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanEditor.tsx scripts/refactor-wall-contrast.py .github/workflows/agent-wall-contrast.yml || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: increase CAD wall contrast"
          git push origin HEAD:agent/wall-contrast
